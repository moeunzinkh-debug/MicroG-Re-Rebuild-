name: Release

on:
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: "Create/update a GitHub Release with built Debug & Release APKs"
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: "Release & Debug APK build"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: "1"

    steps:
      - name: "Free disk space"
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          df -h

      - name: "Checkout sources"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Check sensitive install permissions"
        run: python3 scripts/check_sensitive_manifest_permissions.py

      - name: "Setup Java"
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}

      - name: "Prepare v1+v2+v3 signing keystores"
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          SECRET_KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          SECRET_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        run: |
          KEY_DIR="$RUNNER_TEMP/keystore"
          mkdir -p "$KEY_DIR"

          DBG_PASS="$(openssl rand -hex 16)"
          REL_PASS="$(openssl rand -hex 16)"
          KEYSTORE_DIR="$KEY_DIR" \
          KEYSTORE_PASSWORD="$REL_PASS" \
          KEYSTORE_ENTRY_ALIAS="microg-release" \
          DEBUG_KEYSTORE_PASSWORD="$DBG_PASS" \
          DEBUG_KEYSTORE_ENTRY_ALIAS="microg-dev" \
          bash scripts/generate_keystore.sh >/dev/null

          echo "DEBUG_KEYSTORE_FILE=$KEY_DIR/debug.p12" >> "$GITHUB_ENV"
          echo "DEBUG_KEYSTORE_PASSWORD=$DBG_PASS" >> "$GITHUB_ENV"
          echo "DEBUG_KEYSTORE_ENTRY_ALIAS=microg-dev" >> "$GITHUB_ENV"
          echo "DEBUG_KEYSTORE_ENTRY_PASSWORD=$DBG_PASS" >> "$GITHUB_ENV"

          if [[ -n "$SECRET_KEYSTORE_B64" && -n "$SECRET_KEYSTORE_ALIAS" && -n "$SECRET_KEYSTORE_PASS" ]]; then
            echo "Using repository secret KEYSTORE_B64 for Release signing."
            echo "$SECRET_KEYSTORE_B64" | tr -d ' \n\r\t' | base64 -d > "$KEY_DIR/custom-release.keystore"
            echo "KEYSTORE_FILE=$KEY_DIR/custom-release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$SECRET_KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "KEYSTORE_ENTRY_ALIAS=$SECRET_KEYSTORE_ALIAS" >> "$GITHUB_ENV"
            echo "KEYSTORE_ENTRY_PASSWORD=${SECRET_KEY_PASS:-$SECRET_KEYSTORE_PASS}" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_B64 secret configured; using generated 4096-bit RSA PKCS12 keystore."
            echo "KEYSTORE_FILE=$KEY_DIR/release.p12" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$REL_PASS" >> "$GITHUB_ENV"
            echo "KEYSTORE_ENTRY_ALIAS=microg-release" >> "$GITHUB_ENV"
            echo "KEYSTORE_ENTRY_PASSWORD=$REL_PASS" >> "$GITHUB_ENV"
          fi

      - name: "Build Release & Debug APKs"
        id: version
        run: |
          mkdir -p dist
          VER="$(grep -oP 'def ourGmsVersionName = "\K[^"]+' build.gradle)"
          IS_PRE="false"
          if [[ "$VER" == *-* ]]; then
            IS_PRE="true"
          fi
          echo "tag=$VER" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRE" >> "$GITHUB_OUTPUT"

          build_apk() {
            local target="$1"
            local lower="$2"
            local extra_args="$3"
            local dest_name="$4"
            local out_dir="play-services-core/build/outputs/apk/default/${lower}"
            rm -rf "$out_dir"
            # shellcheck disable=SC2086
            ./gradlew :play-services-core:assembleDefault${target} $extra_args
            local built_apk
            built_apk="$(find "$out_dir" -maxdepth 2 -name '*.apk' | head -n 1)"
            cp "$built_apk" "dist/$dest_name"
          }

          # Release variants (all 6)
          build_apk "Release" "release" "" "microg-${VER}.apk"
          build_apk "Release" "release" "-Pabi=arm64-v8a" "microg-${VER}-icon-arm64-v8a.apk"
          build_apk "Release" "release" "-Pabi=armeabi-v7a" "microg-${VER}-icon-armeabi-v7a.apk"
          build_apk "Release" "release" "-PnoIcon=true" "microg-${VER}-noicon.apk"
          build_apk "Release" "release" "-PnoIcon=true -Pabi=arm64-v8a" "microg-${VER}-noicon-arm64-v8a.apk"
          build_apk "Release" "release" "-PnoIcon=true -Pabi=armeabi-v7a" "microg-${VER}-noicon-armeabi-v7a.apk"

          # Debug variants (Universal + ARM64)
          build_apk "Debug" "debug" "" "microg-${VER}-debug.apk"
          build_apk "Debug" "debug" "-Pabi=arm64-v8a" "microg-${VER}-debug-icon-arm64-v8a.apk"

      - name: "Verify signatures & permissions and generate SHA256SUMS"
        run: |
          bash scripts/verify_built_apk.sh dist/*.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && ls -lh && cat SHA256SUMS.txt)

      - name: "Upload APKs artifact"
        uses: actions/upload-artifact@v7
        with:
          name: MicroG-RE-${{ steps.version.outputs.tag }}-APKs
          if-no-files-found: error
          path: dist/*

      - name: "Publish GitHub Release"
        if: ${{ inputs.publish_github_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MicroG-RE ${{ steps.version.outputs.tag }} (Debug & Release)
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
