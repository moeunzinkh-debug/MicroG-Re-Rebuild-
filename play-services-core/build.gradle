    // Navigation
    implementation "androidx.navigation:navigation-fragment-ktx:$navigationVersion"
    implementation "androidx.navigation:navigation-ui-ktx:$navigationVersion"

    implementation "com.android.volley:volley:$volleyVersion"

    implementation "androidx.lifecycle:lifecycle-service:$lifecycleVersion"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlinVersion"

    implementation "androidx.credentials:credentials:$credentialsVersion"
    implementation "androidx.work:work-runtime-ktx:$workVersion"

    implementation "com.google.guava:guava:$guavaVersion"
    implementation "com.google.crypto.tink:tink-android:$tinkVersion"
    implementation "io.coil-kt:coil-compose:2.4.0"
    implementation "com.google.code.gson:gson:2.14.0"

    // Proper GitHub-flavored markdown rendering for update release notes.
    implementation "com.atlassian.commonmark:commonmark:0.12.1"
}

def releaseStorePath = providers.environmentVariable("KEYSTORE_FILE").orNull ?: localProperties.getProperty("signing.storeFile", rootProject.file("keystore/release.p12").absolutePath)
def releaseStoreFile = file(releaseStorePath)
def releaseStorePass = providers.environmentVariable("KEYSTORE_PASSWORD").orNull ?: localProperties.getProperty("signing.storePassword", "")
def releaseKeyAlias = providers.environmentVariable("KEYSTORE_ENTRY_ALIAS").orNull ?: localProperties.getProperty("signing.keyAlias", "")
def releaseKeyPass = providers.environmentVariable("KEYSTORE_ENTRY_PASSWORD").orNull ?: localProperties.getProperty("signing.keyPassword", releaseStorePass)
def hasReleaseKeystore = releaseStoreFile.exists() && !releaseStorePass.isEmpty() && !releaseKeyAlias.isEmpty()

def debugStorePath = providers.environmentVariable("DEBUG_KEYSTORE_FILE").orNull ?: localProperties.getProperty("signing.debugStoreFile", rootProject.file("keystore/debug.p12").absolutePath)
def debugStoreFile = file(debugStorePath)
def debugStorePass = providers.environmentVariable("DEBUG_KEYSTORE_PASSWORD").orNull ?: localProperties.getProperty("signing.debugStorePassword", "")
def debugKeyAlias = providers.environmentVariable("DEBUG_KEYSTORE_ENTRY_ALIAS").orNull ?: localProperties.getProperty("signing.debugKeyAlias", "")
def debugKeyPass = providers.environmentVariable("DEBUG_KEYSTORE_ENTRY_PASSWORD").orNull ?: localProperties.getProperty("signing.debugKeyPassword", debugStorePass)
def hasCustomDebugKeystore = debugStoreFile.exists() && !debugStorePass.isEmpty() && !debugKeyAlias.isEmpty()

android {
    namespace "$applicationNamespace"

    compileSdkVersion androidCompileSdk
    buildToolsVersion "$androidBuildVersionTools"

    buildFeatures {
        buildConfig = true
        dataBinding = true
        compose true
    }

    defaultConfig {
        versionName version
        versionCode appVersionCode

        minSdkVersion androidMinSdk
        targetSdkVersion androidTargetSdk

        multiDexEnabled true
        multiDexKeepProguard file('multidex-keep.pro')

        applicationId "${basePackageName}.android.gms"

        buildConfigField "String", "APPLICATION_NAMESPACE", "\"${android.namespace}\""
        buildConfigField "String", "BASE_PACKAGE_NAME", "\"$basePackageName\""
        buildConfigField "String", "EDITION_TAG", "\"MicroG-RE\""
        buildConfigField "String", "RELEASE_TAG_PREFIX", "\"microg-re-v\""

        //noinspection GroovyConstructorNamedArguments
        manifestPlaceholders = [
                appLabel           : "@string/gms_app_name",
                basePackageName    : "$basePackageName",
                // Normal builds always show the launcher icon; pass -PnoIcon=true to
                // build a variant with the icon hidden from install time. Only the
                // noicon variant carries the hide/show toggle in Settings.
                launcherIconEnabled: (project.findProperty("noIcon") == "true") ? "false" : "true"
        ]

        // Only the noicon build exposes the hide-launcher-icon feature in Settings.
        resValue "bool", "hide_launcher_icon_available", (project.findProperty("noIcon") == "true") ? "true" : "false"

        // provide package name to xml resources
        resValue "string", "var_authenticator_account_type", "$basePackageName"
        resValue "string", "var_contact_syncadapter_account_type", "$basePackageName"
        resValue "string", "var_pref_auth_action_security_settings", "${basePackageName}.android.gms.accountsettings.SECURITY_SETTINGS"
        resValue "string", "var_pref_auth_action_privacy_settings", "${basePackageName}.android.gms.accountsettings.PRIVACY_SETTINGS"
        resValue "string", "var_pref_auth_action_preferences_settings", "${basePackageName}.android.gms.accountsettings.ACCOUNT_PREFERENCES_SETTINGS"
        resValue "string", "var_pref_start_gms_package", "${basePackageName}.android.gms"

        resValue "string", "package_id", "${basePackageName}.android.gms"

        buildConfigField "String", "SAFETYNET_KEY", "\"${localProperties.get("safetynet.key", "")}\""
        buildConfigField "String", "RECAPTCHA_SITE_KEY", "\"${localProperties.get("recaptcha.siteKey", "")}\""
        buildConfigField "String", "RECAPTCHA_SECRET", "\"${localProperties.get("recaptcha.secret", "")}\""
        buildConfigField "String", "RECAPTCHA_ENTERPRISE_PROJECT_ID", "\"${localProperties.get("recaptchaEnterpreise.projectId", "")}\""
        buildConfigField "String", "RECAPTCHA_ENTERPRISE_SITE_KEY", "\"${localProperties.get("recaptchaEnterpreise.siteKey", "")}\""
        buildConfigField "String", "RECAPTCHA_ENTERPRISE_API_KEY", "\"${localProperties.get("recaptchaEnterpreise.apiKey", "")}\""

        ndk {
            def requestedAbi = project.findProperty("abi")
            // With -Pabi set, ABI splits below handle filtering; an ndk abiFilters
            // would conflict with the split filters.
            if (!requestedAbi) {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
        }
    }

    // ABI splits: when -Pabi=<abi> is set, package ONLY that ABI's native libs
    // (ndk.abiFilters above does not strip jniLibs shipped inside AAR dependencies).
    splits {
        abi {
            if (project.hasProperty("abi")) {
                enable true
                reset()
                include project.property("abi")
                universalApk false
            } else {
                enable false
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs += 'src/main/kotlin'
        }
    }

    lintOptions {
        disable 'MissingTranslation', 'GetLocales', 'InvalidPackage', 'BatteryLife', 'ImpliedQuantity', 'MissingQuantity', 'InvalidWakeLockTag', 'UniquePermission', 'ProtectedPermissions', 'AppLinkUrlError'
        // FIXME: Requires newer kotlin
        disable 'FlowOperatorInvokedInComposition', 'CoroutineCreationDuringComposition', 'StateFlowValueCalledInComposition'
    }

    signingConfigs {
        debug {
            if (hasCustomDebugKeystore) {
                storeFile debugStoreFile
                storePassword debugStorePass
                keyAlias debugKeyAlias
                keyPassword debugKeyPass
            }
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
        if (hasReleaseKeystore) {
            releaseCustom {
                storeFile releaseStoreFile
                storePassword releaseStorePass
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPass
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.releaseCustom
            }
        }
    }

    flavorDimensions = ['target']
    productFlavors {
        "default" {
            dimension 'target'
        }
        "huawei" {
            dimension 'target'
            versionNameSuffix "-hw"
            buildConfigField "String", "EDITION_TAG", "\"MicroG-Original-HW\""
            buildConfigField "String", "RELEASE_TAG_PREFIX", "\"microg-original-hw-v\""
        }
        "personal" {
            dimension 'target'
            versionNameSuffix "-personal"
            matchingFallbacks = ['default']
            buildConfigField "String", "EDITION_TAG", "\"MicroG-Personal\""
            buildConfigField "String", "RELEASE_TAG_PREFIX", "\"microg-personal-v\""
        }
        "user" {
            dimension 'target'
            applicationId = "org.microg.gms"
            versionNameSuffix "-user"
            buildConfigField "String", "EDITION_TAG", "\"MicroG-User\""
            buildConfigField "String", "RELEASE_TAG_PREFIX", "\"microg-user-v\""
            manifestPlaceholders = [
                    appLabel           : "@string/limited_services_app_name",
                    basePackageName    : "org.microg",
                    launcherIconEnabled: (project.findProperty("noIcon") == "true") ? "false" : "true"
            ]
            matchingFallbacks = ['default']
            resValue "string", "package_id", "org.microg.gms"
            // Account type must match AuthConstants.DEFAULT_ACCOUNT_TYPE, which is compiled
            // from the shared BASE_PACKAGE_NAME for every flavor, or AccountManager rejects
            // addAccount with a SecurityException.
            resValue "string", "var_authenticator_account_type", "$basePackageName"
            resValue "string", "var_contact_syncadapter_account_type", "$basePackageName"
            resValue "string", "var_pref_auth_action_security_settings", "org.microg.gms.accountsettings.SECURITY_SETTINGS"
            resValue "string", "var_pref_auth_action_privacy_settings", "org.microg.gms.accountsettings.PRIVACY_SETTINGS"
            resValue "string", "var_pref_auth_action_preferences_settings", "org.microg.gms.accountsettings.ACCOUNT_PREFERENCES_SETTINGS"
            resValue "string", "var_pref_start_gms_package", "org.microg.gms"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = 1.8
    }

    packagingOptions {
        exclude 'META-INF/ASL2.0'
        jniLibs {
            useLegacyPackaging true
        }
    }
}

if (file('user.gradle').exists()) {
    apply from: 'user.gradle'
}

android.applicationVariants.all { variant ->
    def buildSuffix = variant.name.toLowerCase().endsWith("debug") ? "-debug" : (hasReleaseKeystore ? "" : "-unsigned")
    variant.outputs.each { output ->
        output.outputFileName = variant.applicationId + "-" + variant.versionCode + variant.versionName.substring(version.length()) + buildSuffix + ".apk"
    }
}

abstract class IsolateManifestTask extends DefaultTask {
    @Input
    abstract Property<String> getApplicationId()

    @InputFile
    abstract RegularFileProperty getMergedManifest()

    @OutputFile
    abstract RegularFileProperty getUpdatedManifest()

    @TaskAction
    void taskAction() {
        String androidNs = "http://schemas.android.com/apk/res/android"
        String appId = applicationId.get()
        String[] parts = appId.split("\\.")
        String pkgPrefix = parts.length >= 2 ? (parts[0] + "." + parts[1] + ".") : (appId + ".")

        def dbf = DocumentBuilderFactory.newInstance()
        dbf.setNamespaceAware(true)
        def doc = dbf.newDocumentBuilder().parse(mergedManifest.get().asFile)
        Element root = doc.documentElement
        String nsPrefix = root.lookupPrefix(androidNs) ?: "android"

        String sharedUid = root.getAttributeNS(androidNs, "sharedUserId")
        if (sharedUid) {
            logger.lifecycle("ISOLATE_MANIFEST [{}]: Removing sharedUserId='{}'", appId, sharedUid)
            root.removeAttributeNS(androidNs, "sharedUserId")
        }

        Map<String, String> renamedPerms = [:]
        ["permission", "permission-tree", "permission-group"].each { String tagName ->
            def nodes = root.getElementsByTagName(tagName)
            for (int i = 0; i < nodes.length; i++) {
                Element el = (Element) nodes.item(i)
                String name = el.getAttributeNS(androidNs, "name")
                if (name && !name.startsWith(pkgPrefix) && !name.startsWith(appId + ".") && !name.startsWith("android.permission-group.")) {
                    String newName = "${appId}.${name}"
                    renamedPerms[name] = newName
                    el.setAttributeNS(androidNs, "${nsPrefix}:name", newName)
                    logger.lifecycle("ISOLATE_MANIFEST [{}]: Rewrote <{}> '{}' -> '{}'", appId, tagName, name, newName)
                }
            }
        }

        if (!renamedPerms.isEmpty()) {
            def allNodes = root.getElementsByTagName("*")
            for (int i = 0; i < allNodes.length; i++) {
                Element el = (Element) allNodes.item(i)
                ["permission", "readPermission", "writePermission", "permissionGroup"].each { String attr ->
                    String val = el.getAttributeNS(androidNs, attr)
                    if (renamedPerms.containsKey(val)) {
                        el.setAttributeNS(androidNs, "${nsPrefix}:${attr}", renamedPerms[val])
                    }
                }
            }
            renamedPerms.values().each { String newPerm ->
                Element up = doc.createElement("uses-permission")
                up.setAttributeNS(androidNs, "${nsPrefix}:name", newPerm)
                root.insertBefore(up, root.firstChild)
            }
        }

        def providers = root.getElementsByTagName("provider")
        for (int i = 0; i < providers.length; i++) {
            Element prov = (Element) providers.item(i)
            String auths = prov.getAttributeNS(androidNs, "authorities")
            if (auths) {
                String updatedAuths = auths.split(";").collect { String a ->
                    String trimmed = a.trim()
                    if (trimmed && !trimmed.startsWith(pkgPrefix) && !trimmed.startsWith(appId + ".")) {
                        String newAuth = "${appId}.${trimmed}"
                        logger.lifecycle("ISOLATE_MANIFEST [{}]: Rewrote <provider> authority '{}' -> '{}'", appId, trimmed, newAuth)
                        return newAuth
                    }
                    return trimmed
                }.join(";")
                if (updatedAuths != auths) {
                    prov.setAttributeNS(androidNs, "${nsPrefix}:authorities", updatedAuths)
                }
            }
        }

        ["library", "static-library"].each { String libTag ->
            def libs = root.getElementsByTagName(libTag)
            for (int i = 0; i < libs.length; i++) {
                Element lib = (Element) libs.item(i)
                String lName = lib.getAttributeNS(androidNs, "name")
                if (lName && !lName.startsWith(pkgPrefix) && lName != appId && !lName.startsWith(appId + ".")) {
                    String newLib = "${appId}.${lName}"
                    lib.setAttributeNS(androidNs, "${nsPrefix}:name", newLib)
                    logger.lifecycle("ISOLATE_MANIFEST [{}]: Rewrote <{}> '{}' -> '{}'", appId, libTag, lName, newLib)
                }
            }
        }

        def tf = TransformerFactory.newInstance().newTransformer()
        tf.setOutputProperty(OutputKeys.INDENT, "yes")
        tf.setOutputProperty(OutputKeys.ENCODING, "UTF-8")
        def outFile = updatedManifest.get().asFile
        outFile.parentFile.mkdirs()
        outFile.withOutputStream { os ->
            tf.transform(new DOMSource(doc), new StreamResult(os))
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        String capName = variant.name.substring(0, 1).toUpperCase() + variant.name.substring(1)
        def isolateTask = tasks.register("isolate${capName}MergedManifest", IsolateManifestTask) { task ->
            task.applicationId.set(variant.applicationId)
        }
        variant.artifacts.use(isolateTask)
            .wiredWithFiles(
                { task -> task.mergedManifest },
                { task -> task.updatedManifest }
            )
            .toTransform(SingleArtifact.MERGED_MANIFEST.INSTANCE)
    }
}
